services:
  db:
    image: mysql:8.0
    container_name: resto_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    # La base corre en la hora del local, no en UTC: los reportes agrupan por
    # DATE() y HOUR(), y una "hora pico" calculada en UTC está corrida.
    command: >
      --default-authentication-plugin=mysql_native_password
      --default-time-zone=${DB_TIMEZONE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - resto_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: resto_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  resto_db_data:
